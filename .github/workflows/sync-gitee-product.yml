# 只在公开产品仓运行，使用该仓账户的 Actions 分钟；不切换可见性、不构建发版。
name: 公开产品每日同步到 Gitee

# 不接受 push、PR、跨仓 dispatch 或 workflow_call，避免将产品发布与同步耦合。
on:
  workflow_dispatch:
  schedule:
    # 每日 UTC 19:07 = 北京时间次日 03:07；GitHub 调度可能延迟。
    - cron: '7 19 * * *'

# 自动 token 只能读取本仓 contents；不授予管理、写源码或修改可见性的权限。
permissions:
  contents: read

# 同仓任务排队而不取消正在写入的同步，避免中断后错误宣称完成。
concurrency:
  group: madis-pass-gitee-product-mirror
  cancel-in-progress: false

jobs:
  sync:
    name: 公开 product main 到已有公开 Gitee main
    # 只在本产品仓 main 上运行；源码仓与 fork 均不能进入任何 checkout/凭据步骤。
    if: ${{ github.repository == 'MadisTop/madis-pass' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    # Runner 超时回收作为最终兜底；脚本自身也限制网络/Git 命令时长。
    timeout-minutes: 10
    steps:
      # 默认失败关闭；此步骤没有任何 Secret，也不会 checkout 源码。
      - name: 检查 product 仓同步就绪门禁
        env:
          SYNC_READY: ${{ vars.GITEE_PRODUCT_SYNC_READY }}
        run: |
          if [ "$SYNC_READY" != 'true' ]; then
            echo '请先核验 Gitee 公开仓、已有 main 与受限写入者，再在 product 仓设置 GITEE_PRODUCT_SYNC_READY=true。' >&2
            exit 1
          fi

      # 固定 action SHA 和工作流提交，仅获取受信任脚本，不持久化认证信息。
      - name: 获取 product 自身受审阅的同步脚本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MadisTop/madis-pass
          ref: ${{ github.sha }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      # 回归全部使用本地 Git 夹具，测试步骤不注入任何同步凭据。
      - name: 运行无凭据的同步契约与本地 Git 回归
        run: node --test tests/Gitee产品同步.test.mjs

      # 唯一取得项目 Secret 的步骤；身份和快进任一条件失败即停止。
      - name: 核验身份后快进同步已有 main
        # 隔离裸仓会从固定 GitHub HTTPS URL 完整 fetch main，不使用浅 checkout 历史。
        env:
          SOURCE_READ_TOKEN: ${{ github.token }}
          GITEE_PRODUCT_MIRROR_TOKEN: ${{ secrets.GITEE_PRODUCT_MIRROR_TOKEN }}
          GITEE_PRODUCT_SYNC_READY: ${{ vars.GITEE_PRODUCT_SYNC_READY }}
        run: node scripts/sync-gitee-product.mjs
